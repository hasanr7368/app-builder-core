<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppBuilder Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="font-bold text-lg tracking-wide">AppBuilder <span class="text-emerald-400">Core</span></span>
    </div>
    <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700">v0.1 MVP</span>
  </header>

  <!-- Main Container -->
  <main class="flex-1 p-4 max-w-xl mx-auto w-full flex flex-col gap-4">
    
    <!-- Prompt Input Card -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Prompt to App</label>
      <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition" placeholder="e.g. Create a Task Tracker with title, priority badge, and button..."></textarea>
      
      <div class="mt-3 flex justify-between items-center">
        <button id="sampleBtn" class="text-xs text-emerald-400 hover:underline">Load Sample</button>
        <button id="renderBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-4 py-2 rounded-lg transition active:scale-95 shadow-md">Build App</button>
      </div>
    </div>

    <!-- Live Preview Card -->
    <div class="flex-1 bg-slate-800/80 p-4 rounded-xl border border-slate-700 flex flex-col shadow-lg">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Live Mobile Preview</span>
        <span id="statusBadge" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Ready</span>
      </div>
      <div class="flex-1 min-h-[340px] bg-white rounded-lg overflow-hidden border border-slate-600">
        <iframe id="previewFrame" class="w-full h-full border-0"></iframe>
      </div>
    </div>

  </main>

  <script>
    const promptInput = document.getElementById('promptInput');
    const renderBtn = document.getElementById('renderBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const previewFrame = document.getElementById('previewFrame');
    const statusBadge = document.getElementById('statusBadge');

    const sampleSchema = {
      title: "Daily Tasks",
      components: [
        { type: "header", text: "My Priority Checklist" },
        { type: "badge", text: "Status: Active", color: "bg-emerald-100 text-emerald-800" },
        { type: "task", text: "Complete Railway GS Revision", done: false },
        { type: "task", text: "Update AppBuilder Core Code", done: true },
        { type: "button", text: "+ Add New Item" }
      ]
    };

    function renderApp(schema) {
      statusBadge.textContent = "Rendering...";
      statusBadge.className = "text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded";

      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script src="https://cdn.tailwindcss.com"><\/script>
        </head>
        <body class="p-4 bg-slate-50 text-slate-900 font-sans">
          <div class="max-w-md mx-auto space-y-3">
            <h1 class="text-xl font-bold text-slate-900">${schema.title}</h1>
            ${schema.components.map(comp => {
              if (comp.type === 'header') return `<h2 class="text-sm font-semibold text-slate-500 uppercase">${comp.text}</h2>`;
              if (comp.type === 'badge') return `<span class="inline-block text-xs px-2.5 py-1 rounded font-medium ${comp.color}">${comp.text}</span>`;
              if (comp.type === 'task') return `
                <div class="flex items-center gap-2 p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
                  <input type="checkbox" ${comp.done ? 'checked' : ''} class="rounded text-emerald-600">
                  <span class="text-sm ${comp.done ? 'line-through text-slate-400' : 'text-slate-700'}">${comp.text}</span>
                </div>`;
              if (comp.type === 'button') return `<button class="w-full py-2.5 bg-emerald-600 text-white rounded-lg font-medium text-sm shadow hover:bg-emerald-700">${comp.text}</button>`;
              return '';
            }).join('')}
          </div>
        </body>
        </html>
      `;

      previewFrame.srcdoc = htmlContent;
      setTimeout(() => {
        statusBadge.textContent = "Live";
        statusBadge.className = "text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded";
      }, 300);
    }

    sampleBtn.addEventListener('click', () => {
      promptInput.value = "Create a task tracker with status badges and action items.";
      renderApp(sampleSchema);
    });

    renderBtn.addEventListener('click', () => {
      const text = promptInput.value.trim();
      const dynamicSchema = {
        title: text ? text.slice(0, 25) : "Quick Generated App",
        components: [
          { type: "header", text: "Generated View" },
          { type: "badge", text: "Runtime: In-Browser", color: "bg-blue-100 text-blue-800" },
          { type: "task", text: text || "Default Generated Component", done: false },
          { type: "button", text: "Trigger Action" }
        ]
      };
      renderApp(dynamicSchema);
    });

    // Initial default render
    renderApp(sampleSchema);
  </script>
</body>
</html>
